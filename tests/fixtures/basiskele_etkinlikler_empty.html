    .privacy-cookie-banner
    {
        background: #24335b;
        overflow: hidden;
        -webkit-transition: all .5s linear;

        max-height: 0;
        opacity: 0;
        bottom: 0;
        left: 0;
        right: 0;
        position: fixed;
        z-index: 1024;
    }
    .privacy-cookie-banner--slide-down
    {
        -webkit-transform: translateY(100%);
        -ms-transform: translateY(100%);
        transform: translateY(100%);
        opacity: 0;
        max-height: 0;
    }
    .privacy-cookie-banner--slide-up
    {
        -webkit-transform: translateY(0);
        -ms-transform: translateY(0);
        transform: translateY(0);
        opacity: 1;
        max-height: 145px;
        display: flex;
        align-items: center;
        padding: 10px 25px;
        justify-content: space-between;
        z-index: 1150;
    }
    @media (min-width: 375px)
    {
        .privacy-cookie-banner--slide-up
        {
            -webkit-transform: translateY(0);
            -ms-transform: translateY(0);
            transform: translateY(0);
            opacity: 1;
            max-height: 185px;
            display: flex;
            align-items: center;
            padding: 10px 25px;
            justify-content: space-between;
            z-index: 1150;
           
        }
    }
    @media (min-width: 576px)
    {
        .privacy-cookie-banner--slide-up
        {
            -webkit-transform: translateY(0);
            -ms-transform: translateY(0);
            transform: translateY(0);
            opacity: 1;
            max-height: 185px;
            display: flex;
            align-items: center;
            padding: 10px 25px;
            justify-content: space-between;
            z-index: 1150;
        }
    }
    @media screen and (max-width: 767px)
    {
        .privacy-cookie-banner--slide-up
        {
            -webkit-transform: translateY(0);
            -ms-transform: translateY(0);
            transform: translateY(0);
            opacity: 1;
            max-height: 215px;
            display: flex;
            align-items: center;
            padding: 10px 25px;
            justify-content: space-between;
            z-index: 1150;
        }
        .privacy-cookie-banner--slide-up
        {
            flex-direction: column;
        }
    }
    .privacy-cookie-banner__message
    {
        color: #fff;
    }
    .privacy-cookie-banner__message a
    {
        color: #e7581a;
    }

    {
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
        line-height: inherit;
    }

    {
        background: #E7581A;
        color: #fff;
    }
    .privacy-cookie-banner__learn-more
    {
        color: #fff;
        text-decoration: none;
        line-height: 1.5;
    }
    .privacy-cookie-banner__learn-more:hover, .privacy-cookie-banner__learn-more:focus
    {
        color: #E7581A;
        text-decoration: none;
    }
    .privacy-cookie-banner__close
    {
        margin-top: 10px;
        margin-left: 15px;
        color: #fff;
        display: block;
        opacity: 1;
        font-size: 10px;
        text-shadow: none;
    }
    .privacy-cookie-banner__close:hover, .privacy-cookie-banner__close:focus
    {
        color: #E7581A;
        text-decoration: none;
    }
    .privacy-cookie-banner__action

        height: 50px;

        align-items: center;
