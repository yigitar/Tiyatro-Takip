name: keepalive

# GitHub disables scheduled workflows after 60 days without repository activity.
# Best effort: re-enabling scan.yml weekly may or may not reset that inactivity
# timer (uncertain; the data-branch commits made by the scanner may already count
# as activity). If scan ever stops firing, re-enable it manually in the Actions tab.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scan workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scan.yml/enable"
