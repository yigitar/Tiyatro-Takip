name: scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # must exceed one run's burst (BURST_MAX_SECONDS = 960 s) plus two scans and
    # startup, with margin
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # the runner is stdlib-only (tzdata is needed on Windows only): no pip step
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m tiyatro.runner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
